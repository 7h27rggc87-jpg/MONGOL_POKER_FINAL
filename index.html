<!doctype html>
<html lang="mn"><style id="desktop-full-width-fix">
@media (min-width: 768px) {
  /* Үндсэн контейнеруудыг бүтэн дэлгэц болгох */
  .app, .home, .cash, .game, .admin, .auth, .screen {
    max-width: 100% !important;
    width: 100% !important;
  }
  /* Доод цэс */
  .bottom {
    max-width: 100% !important;
    width: 100% !important;
    left: 0 !important;
    transform: none !important;
  }
  /* Покер ширээг томсгох */
  .pokerTable {
    width: calc(100% - 40px) !important;
    max-width: 1200px !important;
    margin: 10px auto 0 !important;
    height: min(70vh, 700px) !important;
  }
  /* Action bar */
  .actionBar {
    max-width: 1200px !important;
    margin: 10px auto !important;
  }
  /* Гар (hole cards) томсгох */
  .mycards .card {
    width: 72px !important;
    height: 102px !important;
    font-size: 30px !important;
  }
  /* Community cards томсгох */
  .board .card {
    width: 56px !important;
    height: 78px !important;
    font-size: 24px !important;
  }
}
</style><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mongol Poker</title></head>
<body><div id="loading">Mongol Poker ачаалж байна…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./index_render_connected.html?rollback=20261013',{cache:'no-store'});
  if(!r.ok)throw new Error('Үндсэн файл олдсонгүй: '+r.status);
  const html=await r.text();
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Сайт ачаалж чадсангүй: '+e.message;console.error(e)}
})();
</script></body></html>
